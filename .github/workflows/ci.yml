name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests + workflow simulation
        run: npm test
      - name: Workflow JSON is current, compiles, and is sanitized
        run: npm run check
